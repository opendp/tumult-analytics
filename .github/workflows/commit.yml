# Updates the dev docs every time a new commit is pushed to main.
name: Commit Pipeline

concurrency: docs-push

on:
  push:
    branches:
      - 'main'


env:
  # Force nox to produce colorful logs:
  FORCE_COLOR: "true"

jobs:
  Package:
    if: github.repository == 'opendp/tumult-analytics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@32bc0f0057965be136de0d438858ee58af190015
      - run: uv run nox -s build
      - name: Archive packaged library
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  Push-Docs:
    if: github.repository == 'opendp/tumult-analytics'
    runs-on: ubuntu-latest
    environment: docs-push
    needs: Package
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@32bc0f0057965be136de0d438858ee58af190015
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Push docs
        uses: opendp/tumult-tools/actions/push_docs@32bc0f0057965be136de0d438858ee58af190015
        with:
          docs-repository: opendp/tumult-docs
          docs-repository-token: ${{ secrets.DOCS_REPO_PAT }}
          docs-path: docs/analytics
          version: dev

